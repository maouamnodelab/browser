name: Build macOS app

on:
  push:
    branches: [ beta ]
  workflow_dispatch:

jobs:
  build-mac:
    strategy:
      matrix:
        include:
          - arch: x64
            os: macos-14
          - arch: arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build Electron app
        run: npm run dist -- --mac --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-browser-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
